<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kodbank - Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card">
    <h1>Welcome to Kodbank</h1>
    <p class="subtitle">Create your account</p>

    <div id="msg" class="msg" style="display: none;"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="uid">User ID</label>
        <input type="text" id="uid" name="uid" placeholder="Enter unique ID" required>
      </div>
      <div class="form-group">
        <label for="uname">Username</label>
        <input type="text" id="uname" name="uname" placeholder="Choose a username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a password" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label for="phonenumber">Phone Number</label>
        <input type="tel" id="phonenumber" name="phonenumber" placeholder="Your phone number" required>
      </div>
      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" name="role">
          <option value="Customer" selected>Customer</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Register</button>
    </form>

    <p class="link">Already have an account? <a href="login.html">Login</a></p>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const msgEl = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');

    function showMsg(text, type) {
      msgEl.textContent = text;
      msgEl.className = 'msg msg-' + type;
      msgEl.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      msgEl.style.display = 'none';

      const data = {
        uid: document.getElementById('uid').value.trim(),
        uname: document.getElementById('uname').value.trim(),
        password: document.getElementById('password').value,
        email: document.getElementById('email').value.trim(),
        phonenumber: document.getElementById('phonenumber').value.trim(),
        role: 'Customer'
      };

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const json = await res.json();

        if (json.success) {
          showMsg(json.message, 'success');
          setTimeout(() => {
            window.location.href = json.redirect || '/login.html';
          }, 1000);
        } else {
          showMsg(json.message || 'Registration failed', 'error');
          submitBtn.disabled = false;
        }
      } catch (err) {
        showMsg('Network error. Please try again.', 'error');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
